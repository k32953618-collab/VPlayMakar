<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPlayMakar</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        video { display: none; }
        #ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px;
            border-radius: 12px; text-align: center; pointer-events: none; z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 95vw;
        }
        h3 { margin: 0 0 4px 0; font-size: 15px; color: #00ffcc; }
        p { margin: 0; font-size: 11px; color: #ddd; line-height: 1.3; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <video id="webcam" autoplay playsinline></video>
    
    <div id="ui">
        <h3>✨ VPlayMakar (MR Sandbox)</h3>
        <p>👌 ОК = Спавн блоков | 👐 2 руки = Хватить и швырнуть NPC/блоки!<br>⚙️ Меню настроек висит в воздухе — коснись его пальцем!</p>
    </div>

    <script>
        const gameSettings = {
            vrMode: false,
            showHands: true
        };

        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.add(groundBody);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        const entities = [];
        const handVisuals = [];

        // Виртуальное меню настроек в пространстве
        const menuGroup = new THREE.Group();
        menuGroup.position.set(0, 1.6, -1.2);

        const menuBg = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.5), new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.8 }));
        menuGroup.add(menuBg);

        const btnVr = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.02), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        btnVr.position.set(0, 0.12, 0.01);
        menuGroup.add(btnVr);

        const btnHands = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.02), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        btnHands.position.set(0, -0.02, 0.01);
        menuGroup.add(btnHands);

        scene.add(menuGroup);

        function spawnNpc(type) {
            let color = type === 'melon' ? 0x2e8b57 : (type === 'pumpkin' ? 0xff8c00 : 0xffd700);
            const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.3, 4, 8), new THREE.MeshStandardMaterial({ color }));
            mesh.position.set((Math.random() - 0.5) * 0.8, 1.5, -1.5);
            scene.add(mesh);

            const body = new CANNON.Body({ mass: 1, position: new CANNON.Vec3(mesh.position.x, mesh.position.y, mesh.position.z), shape: new CANNON.Box(new CANNON.Vec3(0.15, 0.25, 0.15)) });
            world.add(body);
            entities.push({ mesh, body, isNpc: true, isGrabbed: false });
        }

        function spawnShape(type) {
            let geometry = type === 1 ? new THREE.BoxGeometry(0.3, 0.3, 0.3) : (type === 2 ? new THREE.SphereGeometry(0.2, 16, 16) : new THREE.BoxGeometry(0.5, 0.2, 0.3));
            let shape = type === 1 ? new CANNON.Box(new CANNON.Vec3(0.15, 0.15, 0.15)) : (type === 2 ? new CANNON.Sphere(0.2) : new CANNON.Box(new CANNON.Vec3(0.25, 0.1, 0.15)));
            
            const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }));
            mesh.position.set((Math.random() - 0.5) * 0.5, 1.5, -1.5);
            scene.add(mesh);

            const body = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(mesh.position.x, mesh.position.y, mesh.position.z), shape: shape });
            world.add(body);
            entities.push({ mesh, body, isNpc: false, isGrabbed: false });
        }

        spawnNpc('melon');
        spawnNpc('pumpkin');
        spawnShape(1);

        const videoElement = document.getElementById('webcam');
        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

        let lastGestureTime = 0;
        let gestureCount = 0;

        function isOkGesture(landmarks) {
            return Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y) < 0.05;
        }

        hands.onResults((results) => {
            handVisuals.forEach(h => scene.remove(h));
            handVisuals.length = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const handsData = results.multiHandLandmarks;

                if (gameSettings.showHands) {
                    handsData.forEach(lms => {
                        const pointsGeo = new THREE.BufferGeometry();
                        const positions = [];
                        lms.forEach(pt => {
                            positions.push((pt.x - 0.5) * 3, -(pt.y - 0.5) * 3 + 1.5, -pt.z * 2 - 1);
                        });
                        pointsGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                        const pointsMesh = new THREE.Points(pointsGeo, new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.05 }));
                        scene.add(pointsMesh);
                        handVisuals.push(pointsMesh);
                    });
                }

                const indexTip = handsData[0][8];
                const fingerPos = new THREE.Vector3((indexTip.x - 0.5) * 3, -(indexTip.y - 0.5) * 3 + 1.5, -indexTip.z * 2 - 1);
                
                if (fingerPos.distanceTo(btnVr.position.clone().add(menuGroup.position)) < 0.2) {
                    gameSettings.vrMode = !gameSettings.vrMode;
                    btnVr.material.color.set(gameSettings.vrMode ? 0x00ffcc : 0x333333);
                }
                if (fingerPos.distanceTo(btnHands.position.clone().add(menuGroup.position)) < 0.2) {
                    gameSettings.showHands = !gameSettings.showHands;
                    btnHands.material.color.set(gameSettings.showHands ? 0x00ffcc : 0x333333);
                }

                if (handsData.length === 1) {
                    const lms = handsData[0];
                    if (isOkGesture(lms)) {
                        const now = Date.now();
                        if (now - lastGestureTime < 600) { gestureCount = (gestureCount % 3) + 1; }
                        else { gestureCount = 1; }
                        lastGestureTime = now;
                        spawnShape(gestureCount);
                    }
                } else if (handsData.length === 2) {
                    const h1 = handsData[0][9];
                    const h2 = handsData[1][9];
                    const h1Pos = new THREE.Vector3((h1.x - 0.5)*3, -(h1.y - 0.5)*3 + 1.5, -h1.z*2 - 1);
                    const h2Pos = new THREE.Vector3((h2.x - 0.5)*3, -(h2.y - 0.5)*3 + 1.5, -h2.z*2 - 1);

                    entities.forEach(ent => {
                        if (ent.mesh.position.distanceTo(h1Pos) < 0.6) {
                            ent.isGrabbed = true;
                            ent.body.mass = 0;
                            const midX = (h1Pos.x + h2Pos.x) / 2;
                            const midY = (h1Pos.y + h2Pos.y) / 2;
                            const midZ = (h1Pos.z + h2Pos.z) / 2;
                            ent.mesh.position.set(midX, midY, midZ);
                            ent.body.position.set(midX, midY, midZ);
                        } else if (ent.isGrabbed) {
                            ent.isGrabbed = false;
                            ent.body.mass = 1;
                            ent.body.updateMassProperties();
                            ent.body.velocity.set(0, 4, -6);
                        }
                    });
                }
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cameraUtils.start();

        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60);

            entities.forEach(ent => {
                if (!ent.isGrabbed) {
                    ent.mesh.position.copy(ent.body.position);
                    ent.mesh.quaternion.copy(ent.body.quaternion);
                }
            });

            if (gameSettings.vrMode) {
                renderer.setScissorTest(true);
                renderer.setScissor(0, 0, window.innerWidth / 2, window.innerHeight);
                renderer.setViewport(0, 0, window.innerWidth / 2, window.innerHeight);
                renderer.render(scene, camera);

                renderer.setScissor(window.innerWidth / 2, 0, window.innerWidth / 2, window.innerHeight);
                renderer.setViewport(window.innerWidth / 2, 0, window.innerWidth / 2, window.innerHeight);
                renderer.render(scene, camera);
                renderer.setScissorTest(false);
            } else {
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.render(scene, camera);
            }
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
